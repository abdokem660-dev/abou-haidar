name: Validate Site Files

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.js'
      - 'SECURITY.md'
  pull_request:
    branches: [main]
    paths:
      - '**.html'
      - '**.js'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check critical files exist
        run: |
          for f in index.html admin.html site-render.js site-content.js; do
            [ -f "$f" ] || { echo "::error::Missing critical file: $f"; exit 1; }
          done

      - name: Verify CSP meta tag in index.html
        run: |
          grep -q 'http-equiv="Content-Security-Policy"' index.html \
            || { echo "::error::CSP meta tag missing from index.html"; exit 1; }

      - name: Verify CSP meta tag in admin.html
        run: |
          grep -q 'http-equiv="Content-Security-Policy"' admin.html \
            || { echo "::error::CSP meta tag missing from admin.html"; exit 1; }

      - name: Verify noindex in admin.html
        run: |
          grep -q 'name="robots".*noindex' admin.html \
            || { echo "::error::noindex meta tag missing from admin.html"; exit 1; }

      - name: Verify sessionStorage (not localStorage) for token in admin
        run: |
          ! grep -q 'localStorage.*ah-token' admin.html \
            || { echo "::error::admin.html still uses localStorage for ah-token — must use sessionStorage"; exit 1; }
          grep -q 'sessionStorage.*ah-token' admin.html \
            || { echo "::error::admin.html missing sessionStorage usage for ah-token"; exit 1; }

      - name: No dangerous patterns in JS
        run: |
          ERRORS=0
          for f in site-render.js; do
            if grep -n 'document\.write(' "$f"; then
              echo "::error file=$f::document.write() found — XSS risk"
              ERRORS=$((ERRORS+1))
            fi
            if grep -n 'eval(' "$f"; then
              echo "::error file=$f::eval() found — code injection risk"
              ERRORS=$((ERRORS+1))
            fi
          done
          [ "$ERRORS" -eq 0 ] || exit 1

      - name: Verify sanitizeText usage in site-render.js
        run: |
          grep -c 'sanitizeText(' site-render.js | awk '{if($1<5){print "::warning::Only "$1" sanitizeText() calls found — expected more"; exit 1}}'

      - name: Verify no accidental secrets
        run: |
          ERRORS=0
          for f in site-render.js site-content.js index.html admin.html; do
            if grep -inE '(sk_live|pk_live|ghp_|gho_|AKIA|password\s*=\s*["\x27][^"\x27]+["\x27])' "$f"; then
              echo "::error file=$f::Possible hardcoded secret found"
              ERRORS=$((ERRORS+1))
            fi
          done
          [ "$ERRORS" -eq 0 ] || exit 1

      - name: Verify SECURITY.md exists
        run: |
          [ -f "SECURITY.md" ] || { echo "::error::SECURITY.md missing"; exit 1; }
